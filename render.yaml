# Render Blueprint for the live server (planning/milestone-4.5.md, D1, D7).
# A free web service, built from this repo's Dockerfile. See docs/deployment.md.
#
# Zero cost: never add a payment method to the Render workspace. Without one,
# a quota that runs out suspends the service (or stops builds) until the next
# month, instead of billing.
services:
  - type: web
    name: data-quality-mcp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Deploy a commit only once all its GitHub checks pass. No `branch`: the
    # service follows the branch the Blueprint was created from.
    autoDeployTrigger: checksPass
    envVars:
      # The image listens on 8000; this tells Render where to route
      - key: PORT
        value: "8000"
      # Limits for 512 MB / 0.1 CPU, measured in a capped container (D7, and
      # docs/deployment.md). Every worst case peaked under 320 MiB; the XLSX
      # expansion cap keeps the slowest call (a numeric XLSX) under 60 s.
      - key: DATA_QUALITY_MCP_MAX_HTTP_REQUEST_MB
        value: "8"
      - key: DATA_QUALITY_MCP_MAX_FILE_SIZE_MB
        value: "8"
      - key: DATA_QUALITY_MCP_MAX_XLSX_UNCOMPRESSED_MB
        value: "35"
      - key: DATA_QUALITY_MCP_MAX_ROWS
        value: "100000"
      - key: DATA_QUALITY_MCP_MAX_INLINE_OUTPUT_MB
        value: "1"
      # OAuth (D6). Not secret, but typed into the dashboard when the
      # Blueprint is created, so a fork sets its own: the AuthKit domain,
      # https://<name>.onrender.com, and the owner's WorkOS user ID.
      - key: DATA_QUALITY_MCP_OAUTH_ISSUER
        sync: false
      - key: DATA_QUALITY_MCP_PUBLIC_URL
        sync: false
      - key: DATA_QUALITY_MCP_OAUTH_OWNER
        sync: false
