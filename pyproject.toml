[project]
name = "data-quality-mcp"
version = "0.1.0"
description = "MCP server exposing deterministic dataset profiling and cleaning as tools for AI agents"
readme = "README.md"
license = "MIT"
authors = [{ name = "Farmand Bazdiditehrani" }]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.2,<3",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "typing_extensions>=4.12",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
data-quality-mcp = "data_quality_mcp.server:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_quality_mcp"]

[tool.ruff]
line-length = 88
target-version = "py310"
# Docs are hand-formatted; don't let ruff rewrite code blocks inside Markdown
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["data_quality_mcp"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
